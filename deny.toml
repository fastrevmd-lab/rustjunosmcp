# cargo-deny policy, aligned with rustpanosmcp so both consumers of the mecmcp
# crate family enforce the same supply-chain posture.
# See fastrevmd-lab/mecmcp PLAN.md, Phase 0.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    # foldhash, reached transitively through hashbrown. Permissive, OSI-approved.
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
