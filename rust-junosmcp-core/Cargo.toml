[package]
name        = "rust-junosmcp-core"
version     = "0.15.3"
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
description = "Core logic and Junos tool handlers for rust-junosmcp."

[lints]
workspace = true

[dependencies]
chrono       = { workspace = true }
tokio        = { workspace = true }
tokio-util   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true, features = ["preserve_order"] }
thiserror    = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
schemars     = { workspace = true }
rustez       = { workspace = true }
globset      = { workspace = true }
regex        = { workspace = true }
async-trait  = { workspace = true }
minijinja    = { workspace = true }
arc-swap     = { workspace = true }
tempfile     = { workspace = true }
sha2         = { workspace = true }
axum         = { workspace = true }
tower-http   = { workspace = true, features = ["limit"] }
http         = { workspace = true }
http-body    = { workspace = true }
http-body-util = { workspace = true }
rmcp         = { version = "2", features = ["server", "transport-streamable-http-server"] }
rust-junosmcp-auth = { version = "0.15.1", path = "../rust-junosmcp-auth" }
mecmcp-transport = { workspace = true }
mecmcp-policy = { workspace = true }
mecmcp-inventory = { workspace = true }
mecmcp-device = { workspace = true }
mecmcp-changeset = { workspace = true }
mecmcp-audit = { workspace = true }
dashmap      = { workspace = true }
futures      = "0.3"
rustnetconf  = { workspace = true }

[dev-dependencies]
tower        = { workspace = true }
mecmcp-audit = { workspace = true }
uuid         = "1"
