title = "rustjunosmcp gitleaks config"

[extend]
path = ".gitleaks-vendor.toml"

# NOTE: this must be the singular `[allowlist]` table, not `[[allowlists]]`.
# The gitleaks version pinned in .github/workflows/security.yml (gitleaks-action
# v3.0.0 -> gitleaks 8.24.3) parses `[[allowlists]]` without error but never
# applies it, so every regex/path below silently stopped taking effect and
# every hygiene-fixture commit kept failing CI on the FAKE-marked placeholders
# it had just introduced. Combine both exclusions into one table instead.
[allowlist]
description = "redact.rs test fixtures and FAKE-marked placeholder credential material"
paths = [
  # redact.rs's own #[cfg(test)] module exercises the redactor against
  # synthetic Junos secret strings; it is not itself a leak.
  '''rust-junosmcp-srx-core/src/workflows/support_bundle/redact\.rs$''',
]
regexes = [
  # Sanitized lab-capture fixtures use placeholder credential material carrying
  # an explicit FAKE marker right after the crypt prefix. Allowlist the marker,
  # not the file path, so a real value re-captured into any file still fails.
  # See docs/superpowers/captures/README.md for the policy.
  '''\$[1569]\$FAKE[A-Za-z0-9./]*''',
]
