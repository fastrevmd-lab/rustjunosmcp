name: Release image

# Build and publish the default-feature Junos/SRX rust-junosmcp image to GHCR
# on every version tag (v1.2.3).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the image, e.g. v0.7.0 (-> tags 0.7.0, 0.7, latest)'
        required: true
      ref:
        description: 'Git ref/commit to build (default: the branch this workflow runs from, usually main). Use this to backfill a release whose own tagged tree predates a Dockerfile fix.'
        required: false
        default: ''

jobs:
  release:
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing exchanges this job's OIDC token for a
      # short-lived Fulcio certificate; no key material is stored anywhere.
      # This workflow only ever runs from a version-tag push or an explicit
      # workflow_dispatch backfill of an already-tagged release (see the
      # `ref` input above) -- never from a PR or an untagged branch push --
      # so a Rekor transparency-log entry is only ever created for a
      # board-approved release. A reusable workflow's permissions can only
      # be narrowed by the caller, never widened, so this job must grant
      # them itself -- see mecmcp's docs/RELEASE-WORKFLOWS.md.
      id-token: write
    # TODO(MEC-514 follow-up): repin to a released mecmcp tag once
    # mechubsec/mecmcp#440 merges and mecmcp cuts its next tag.
    uses: mechubsec/mecmcp/.github/workflows/reusable-release-image.yml@34bc01f1b7cddec9d73999170ae748dbeec76ff7
    with:
      # GHCR requires a lowercase image path; github.repository is already lowercase.
      image: ghcr.io/${{ github.repository }}
      version: ${{ github.event.inputs.version }}
      ref: ${{ github.event.inputs.ref }}
      smoke-test-command: ./packaging/tests/container-scp-smoke.sh
