name: Codex review

# Advisory review of each commit in a pull request.
#
# Deliberately NOT a required check yet. Across the Phase 5 work this review
# surfaced roughly forty findings, of which a handful were wrong — stale
# verdicts on already-fixed code, and one case where the reviewer was right and
# the human reading was wrong. Making it blocking on day one means a false
# finding stops a legitimate merge at an inconvenient hour. Run it advisory,
# watch the false-positive rate, and promote it to required when it earns that.
#
# It reviews commits ONE AT A TIME rather than the whole PR range. A wide diff
# exceeds the review budget and returns nothing at all, which reads as a pass
# if you are not watching for it — that happened repeatedly on a ~700-line
# commit. Per-commit keeps each review bounded and rewards small commits.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Codex review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the merge base and each commit are reachable.
          fetch-depth: 0

      - name: Check for credentials
        id: creds
        env:
          CODEX_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          if [[ -z "${CODEX_KEY}" ]]; then
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "::notice::CODEX_API_KEY is not set; skipping review."
          else
            echo "available=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Install codex
        if: steps.creds.outputs.available == 'true'
        run: npm install -g @openai/codex

      - name: Review each commit
        if: steps.creds.outputs.available == 'true'
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          : >findings.md

          mapfile -t commits < <(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")
          if (( ${#commits[@]} == 0 )); then
            echo "No commits to review." >>findings.md
            exit 0
          fi

          # A PR with a very long history is usually a rebase artefact rather
          # than forty things needing review. Cap it and say so, rather than
          # silently reviewing a subset.
          if (( ${#commits[@]} > 10 )); then
            echo "> Reviewing the last 10 of ${#commits[@]} commits." >>findings.md
            echo >>findings.md
            commits=("${commits[@]: -10}")
          fi

          for sha in "${commits[@]}"; do
            # A commit subject is attacker-controlled text that ends up in a PR
            # comment. Shell-quoting already prevents command substitution — a
            # variable's contents are not re-parsed — but backticks and
            # backslashes can still break out of the markdown, so strip them and
            # bound the length.
            subject=$(git log -1 --format=%s "$sha" | tr -d '`\\\r\n' | cut -c1-120)
            echo "Reviewing ${sha:0:8} — ${subject}"

            # `--commit` bounds the diff to one change. Never `--uncommitted`,
            # and never a wide `--base` range: both blow the budget and return
            # nothing, which is indistinguishable from a clean result.
            if ! timeout 600 codex exec review --commit "$sha" --json >raw.jsonl 2>err.txt; then
              {
                echo "### \`${sha:0:8}\` — ${subject}"
                echo
                echo "**The review did not complete.** No verdict was produced, which is"
                echo "not the same as a clean result. Re-run, or review this commit by hand."
                echo
              } >>findings.md
              continue
            fi

            verdict=$(jq -rR 'fromjson? | select(.type=="item.completed") | .item
                              | select(.type=="agent_message") | .text' raw.jsonl)

            if [[ -z "${verdict}" ]]; then
              {
                echo "### \`${sha:0:8}\` — ${subject}"
                echo
                echo "**No verdict returned.** The gate did not run on this commit."
                echo
              } >>findings.md
              continue
            fi

            {
              echo "### \`${sha:0:8}\` — ${subject}"
              echo
              echo "${verdict}"
              echo
            } >>findings.md
          done

      - name: Post findings
        if: steps.creds.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Codex review"
            echo
            cat findings.md
            echo
            echo "---"
            echo "_Advisory. Findings are not always right — check them against the"
            echo "code before acting. A commit reporting no verdict was not reviewed._"
          } >comment.md
          gh pr comment "${PR}" --body-file comment.md
