name: Sign release tarball

# The LXC release tarball is uploaded to the GitHub release by hand as the
# last step of the documented release process (see
# docs/superpowers/specs/2026-07-16-v0.8.0-release-design.md), after the tag
# push and the `Release image` workflow have already run. So this signs on
# `release: published`, not on the tag push itself -- the tarball asset does
# not exist yet at tag-push time. A release is only published by the board
# user, so this never fires from a PR, a branch push, or an unreviewed tag.
on:
  release:
    types: [published]

jobs:
  sign:
    permissions:
      contents: write
      # Keyless cosign signing exchanges this job's OIDC token for a
      # short-lived Fulcio certificate; no key material is stored anywhere.
      # A reusable workflow's permissions can only be narrowed by the
      # caller, never widened, so this job must grant them itself -- see
      # mecmcp's docs/RELEASE-WORKFLOWS.md.
      id-token: write
    # Pinned to mecmcp main after #440 merged (squash). Repin to a mecmcp tag once one is cut.
    uses: mechubsec/mecmcp/.github/workflows/reusable-sign-release-tarball.yml@8ede62a31917ad4d5f41ca2a664601280b2ddc41
