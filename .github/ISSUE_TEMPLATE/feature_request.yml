name: Feature request
description: Suggest an idea for this project
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that you can't do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >-
        What would you like to see happen? Sketch a tool/MCP schema shape if
        you have one in mind. Note if this would touch a device-changing
        path (config load/commit, upgrade, package lifecycle) — those need
        extra care around the existing deterministic safety checks.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
