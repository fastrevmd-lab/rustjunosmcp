[workspace]
members          = ["rust-junosmcp", "rust-junosmcp-core", "rust-junosmcp-auth", "rust-junosmcp-srx-core"]
default-members  = ["rust-junosmcp", "rust-junosmcp-core", "rust-junosmcp-auth"]
resolver = "2"

[workspace.package]
edition      = "2024"
rust-version = "1.88"
license      = "MIT"
repository   = "https://github.com/fastrevmd-lab/rustjunosmcp"
authors      = ["fastrevmd-lab"]

# Shared lint posture, adopted from rustpanosmcp so both servers can consume the
# mecmcp crate family on the same terms. See fastrevmd-lab/mecmcp PLAN.md.
#
# `unsafe_code` is `forbid` as of mecmcp Phase 3b (mecmcp#35). Unlike `deny`,
# `forbid` cannot be locally overridden, so no future `#[allow]` can reintroduce
# unsafe code into a server that holds credentials for a firewall fleet.
#
# Reaching it took two steps. Phase 1 replaced rust-junosmcp-auth's hand-rolled
# `write_volatile` secret zeroing with the `zeroize` crate. Phase 3b moved SIGHUP
# signalling into `mecmcp-runtime`, which reaches the syscall through `rustix`
# rather than `libc::kill` — that removed the last two allows, in `token_cmd.rs`
# and the `http_reload` test.
# `missing_docs` and `clippy::unwrap_used` are deferred, NOT dismissed: this
# codebase predates the house style rustpanosmcp was written into, and enabling
# them emits ~730 and ~960 findings respectively. Left at "warn" they would bury
# every genuinely new warning, so they are "allow" until the debt is paid.
#
# `missing_docs` is deferred, not dismissed: enabling it emits ~690 findings
# in shipping code. All are genuinely missing docs, not false positives. Tracked
# in issue #193. `unwrap_used` has been addressed: all unwraps in shipping code
# are now `.expect()` with invariant messages; test code is allowed via
# `#![cfg_attr(test, allow(clippy::unwrap_used))]` at crate level and
# `#![allow(clippy::unwrap_used)]` in separate test files.
[workspace.lints.rust]
missing_docs = "allow"
unsafe_code  = "forbid"

[workspace.lints.clippy]
all         = { level = "warn", priority = -1 }
dbg_macro   = "deny"
todo        = "deny"
unwrap_used = "deny"

[workspace.dependencies]
tokio        = { version = "1", features = ["full"] }
tokio-util   = { version = "0.7", default-features = false, features = ["rt"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
tracing      = "0.1"
async-trait      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars     = "1.0"
anyhow       = "1"
rustez       = "0.13"
# `version` is redundant for resolution alongside `tag`, but cargo-deny reads a
# versionless dependency as a wildcard and rejects it under [bans].
# All mecmcp crates MUST resolve to the same git ref. Cargo keys a git
# dependency on its source, not just its version, so two different refs produce
# two copies of mecmcp-auth in the graph — and two distinct `CallerCtx` types
# with different TypeIds. `Extensions::get::<CallerCtx>()` then silently returns
# None, and every per-token limit stops enforcing while still logging as
# configured. That is not theoretical: it already happened in this repo.
#
# mecmcp 0.7.0: adds graceful HTTP shutdown, GracefulShutdown::new returns Result.
# TEMP: feat/changeset-cancel branch for cancel_change_set development
mecmcp-audit = { version = "0.8.4", git = "https://github.com/fastrevmd-lab/mecmcp", branch = "feat/changeset-cancel" }
mecmcp-auth  = { version = "0.8.4", git = "https://github.com/fastrevmd-lab/mecmcp", branch = "feat/changeset-cancel" }
mecmcp-transport = { version = "0.8.4", git = "https://github.com/fastrevmd-lab/mecmcp", branch = "feat/changeset-cancel" }
mecmcp-runtime = { version = "0.8.4", git = "https://github.com/fastrevmd-lab/mecmcp", branch = "feat/changeset-cancel" }
mecmcp-policy = { version = "0.8.4", git = "https://github.com/fastrevmd-lab/mecmcp", branch = "feat/changeset-cancel" }
mecmcp-inventory = { version = "0.8.4", git = "https://github.com/fastrevmd-lab/mecmcp", branch = "feat/changeset-cancel" }
mecmcp-device = { version = "0.8.4", git = "https://github.com/fastrevmd-lab/mecmcp", branch = "feat/changeset-cancel" }
mecmcp-changeset = { version = "0.8.4", git = "https://github.com/fastrevmd-lab/mecmcp", branch = "feat/changeset-cancel" }
mecmcp-scp = { version = "0.8.4", git = "https://github.com/fastrevmd-lab/mecmcp", branch = "feat/changeset-cancel" }
mecmcp-secret = { version = "0.8.4", git = "https://github.com/fastrevmd-lab/mecmcp", branch = "feat/changeset-cancel" }
globset      = "0.4"
regex        = "1"
metrics                     = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

# auth + remote transport (sub-project #2)
arc-swap         = "1"
sha2             = "0.10"
hmac             = "0.12"
rand             = "0.8"
subtle           = "2"
base64ct         = { version = "1", features = ["alloc"] }
chrono           = { version = "0.4", default-features = false, features = ["serde", "clock"] }
axum             = "0.8"
tower            = "0.5"
tower-http       = "0.6"
http             = "1"
http-body-util   = "0.1"
rustls           = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
axum-server      = { version = "0.8", default-features = false }
rcgen            = "0.14"
tempfile         = "3"
ureq             = "2"
minijinja        = { version = "2", default-features = false, features = ["builtins", "loader", "serde"] }
dashmap          = "6"
http-body        = "1"
rustnetconf      = "0.13"
rustix           = "0.38"
