[workspace]
members          = ["rust-junosmcp", "rust-junosmcp-core", "rust-junosmcp-auth", "rust-junosmcp-srx-core"]
default-members  = ["rust-junosmcp", "rust-junosmcp-core", "rust-junosmcp-auth"]
resolver = "2"

[workspace.package]
edition      = "2024"
rust-version = "1.88"
license      = "MIT"
repository   = "https://github.com/fastrevmd-lab/rustjunosmcp"
authors      = ["fastrevmd-lab"]

# Shared lint posture, adopted from rustpanosmcp so both servers can consume the
# mecmcp crate family on the same terms. See fastrevmd-lab/mecmcp PLAN.md.
#
# `unsafe_code` is `deny` rather than `forbid` for now: rust-junosmcp-auth's
# `Secret::drop` hand-rolls secret zeroing with `write_volatile` and carries a
# targeted `#[allow]`. mecmcp Phase 1 replaces that code with the `zeroize`
# crate, at which point this becomes `forbid` and the allow is deleted.
# `missing_docs` and `clippy::unwrap_used` are deferred, NOT dismissed: this
# codebase predates the house style rustpanosmcp was written into, and enabling
# them emits ~730 and ~960 findings respectively. Left at "warn" they would bury
# every genuinely new warning, so they are "allow" until the debt is paid.
#
# Neither represents a defect. All 959 unwrap findings but 13 are in tests, and
# those 13 were reviewed individually: every one is guarded by an earlier return
# or a loop invariant the lint cannot see. Tracked in issue #193; the debt
# shrinks on its own as mecmcp phases delete code.
[workspace.lints.rust]
missing_docs = "allow"
unsafe_code  = "deny"

[workspace.lints.clippy]
all         = { level = "warn", priority = -1 }
dbg_macro   = "deny"
todo        = "deny"
unwrap_used = "allow"

[workspace.dependencies]
tokio        = { version = "1", features = ["full"] }
tokio-util   = { version = "0.7", default-features = false, features = ["rt"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
tracing      = "0.1"
async-trait      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars     = "1.0"
anyhow       = "1"
rustez       = "0.13"
# `version` is redundant for resolution alongside `tag`, but cargo-deny reads a
# versionless dependency as a wildcard and rejects it under [bans].
# mecmcp-audit v0.1.5 includes mecmcp-auth 0.1.5 as a transitive dependency from
# the same commit, so we only need to specify the audit tag. Referencing both tags
# separately would pull two different commits of mecmcp-auth and cause type mismatches.
mecmcp-audit = { version = "0.1.5", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "audit-v0.1.5" }
mecmcp-auth  = { version = "0.1.5", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "audit-v0.1.5" }
globset      = "0.4"
regex        = "1"
metrics                     = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

# auth + remote transport (sub-project #2)
arc-swap         = "1"
sha2             = "0.10"
hmac             = "0.12"
rand             = "0.8"
subtle           = "2"
base64ct         = { version = "1", features = ["alloc"] }
chrono           = { version = "0.4", default-features = false, features = ["serde", "clock"] }
axum             = "0.8"
tower            = "0.5"
tower-http       = "0.6"
http             = "1"
http-body-util   = "0.1"
rustls           = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
axum-server      = { version = "0.8", default-features = false }
rcgen            = "0.14"
tempfile         = "3"
ureq             = "2"
minijinja        = { version = "2", default-features = false, features = ["builtins", "loader", "serde"] }
dashmap          = "6"
http-body        = "1"
rustnetconf      = "0.13"
